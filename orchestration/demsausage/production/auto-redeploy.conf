# Auto-redeploy target configuration for demsausage production
# Always committed; activated by symlink in auto-redeploy/enabled/demsausage-production.conf
# ${STACK_DIR} is set by auto-redeploy.sh at runtime.

GITHUB_REPO="keithamoss/demsausage"
WORKFLOW_FILE="production_cicd.yml"
BRANCH="main"
COMPOSE_FILE="${STACK_DIR}/demsausage/production.yml"
CLOUDFLARE_PURGE="true"
CLOUDFLARE_ENV="${STACK_DIR}/orchestration/secrets/cloudflare.env"
WATCH_TIMEOUT_MINS="15"
REFRESH_NGINX="true"
