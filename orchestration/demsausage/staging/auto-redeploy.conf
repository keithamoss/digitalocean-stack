# Auto-redeploy target configuration for demsausage staging
# Always committed; activated by symlink in auto-redeploy/enabled/demsausage-staging.conf
# ${STACK_DIR} is set by auto-redeploy.sh at runtime.

GITHUB_REPO="keithamoss/demsausage"
WORKFLOW_FILE="staging_cicd.yml"
BRANCH="staging"
COMPOSE_FILE="${STACK_DIR}/demsausage/staging.yml"
CLOUDFLARE_PURGE="true"
CLOUDFLARE_ENV="${STACK_DIR}/orchestration/secrets/cloudflare.env"
WATCH_TIMEOUT_MINS="15"
REFRESH_NGINX="true"
