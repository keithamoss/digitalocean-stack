networks:
  redis:
    external: true
  demsausage-staging:
    # Ensure the network is created by this compose file the first time we run it
    external: false
    name: demsausage-staging
services:
  demsausage:
    image: keithmoss/demsausage-django:latest-staging
    command: supervisord
    volumes:
      - ../logs/demsausage-staging:/app/logs:delegated
    networks:
      redis:
      demsausage-staging:
        # Alias needed because the container's default DNS name is the service key ("demsausage"),
        # which collides with the production container when nginx joins both networks.
        aliases:
          - demsausage-staging
    env_file:
      - secrets/sausage-web.env
      - secrets/sausage-db.env
  memcached:
    image: memcached
    command:
      # 5mb to accommodate the larger polling place GeoJSON objects
      - "--max-item-size=5242880"
    networks:
      demsausage-staging:
        # Alias avoids collision with the production memcached container on the shared nginx network.
        aliases:
          - memcached-staging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
  rq_dashboard:
    image: keithmoss/demsausage-rq-dashboard:latest-staging
    env_file:
      - secrets/rq-dashboard.env
    networks:
      redis:
      demsausage-staging:
        # Alias avoids collision with the production rq_dashboard container on the shared nginx network.
        aliases:
          - rq-dashboard-staging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
